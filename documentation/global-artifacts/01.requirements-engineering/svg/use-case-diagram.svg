<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1256.4px" preserveAspectRatio="none" style="width:649px;height:1256px;background:#FFFFFF;" version="1.1" viewBox="0 0 649 1256" width="649.6px" zoomAndPan="magnify"><defs/><g><!--entity PO--><g id="elem_PO"><ellipse cx="28.2" cy="922.2" fill="#F1F1F1" rx="3.2" ry="3.2" style="stroke:#181818;stroke-width:0.20000000000000004;"/><path d="M28.2,925.4 L28.2,936.2 M23,928.6 L33.4,928.6 M28.2,936.2 L23,942.2 M28.2,936.2 L33.4,942.2 " fill="none" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="37.6" x="9.4" y="948.843">Product Owner</text></g><!--entity PFM--><g id="elem_PFM"><ellipse cx="28.2" cy="585.8" fill="#F1F1F1" rx="3.2" ry="3.2" style="stroke:#181818;stroke-width:0.20000000000000004;"/><path d="M28.2,589 L28.2,599.8 M23,592.2 L33.4,592.2 M28.2,599.8 L23,605.8 M28.2,599.8 L33.4,605.8 " fill="none" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="51.6" x="2.4" y="612.443">Plant Floor Manager</text></g><!--entity PM--><g id="elem_PM"><ellipse cx="28.2" cy="213" fill="#F1F1F1" rx="3.2" ry="3.2" style="stroke:#181818;stroke-width:0.20000000000000004;"/><path d="M28.2,216.2 L28.2,227 M23,219.4 L33.4,219.4 M28.2,227 L23,233 M28.2,227 L33.4,233 " fill="none" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="43.6" x="6.4" y="239.643">Product Manager</text></g><g id="elem_UC1"><ellipse cx="362.6231" cy="691.7646" fill="#F1F1F1" rx="64.0231" ry="13.7646" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="115.2" x="305.0231" y="693.2834">UCBD 001 - Create a data dictionary/glossary</text></g><g id="elem_UC2"><ellipse cx="362.6412" cy="735.4482" fill="#F1F1F1" rx="73.4412" ry="15.6482" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="134.8" x="295.2412" y="736.967">UCBD 002 - Create the relational model (logical level)</text></g><g id="elem_UC3"><ellipse cx="362.569" cy="781.0738" fill="#F1F1F1" rx="75.569" ry="16.0738" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="139.2" x="292.969" y="782.5925">UCBD 003 - Create the relational model (physical level)</text></g><g id="elem_UC4"><ellipse cx="362.5223" cy="832.5045" fill="#F1F1F1" rx="102.7223" ry="21.5045" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="194.8" x="265.1223" y="834.0232">UCBD 004 - import data from a legacy system and deliver it on a spreadsheet</text></g><g id="elem_UC5"><ellipse cx="362.6921" cy="901.4584" fill="#F1F1F1" rx="160.4921" ry="33.0584" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="311.6" x="206.8921" y="902.9772">UCBD 005 - associate with each product, orders to be delivered (customer, product, quantity, date) within a certain deadline</text></g><g id="elem_UC6"><ellipse cx="362.502" cy="968.2204" fill="#F1F1F1" rx="93.302" ry="19.6204" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="175.6" x="274.702" y="969.7392">UCBD 006 - discover the types of workstations used in a certain order</text></g><g id="elem_UC7"><ellipse cx="362.688" cy="1042.1376" fill="#F1F1F1" rx="196.888" ry="40.3376" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="384.8" x="170.288" y="1043.6563">UCBD 007 - discover the materials/components that must be ordered to fulfill a given production order, including the quantity of each material/component</text></g><g id="elem_UC8"><ellipse cx="362.5974" cy="565.3595" fill="#F1F1F1" rx="88.9974" ry="18.7595" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="166.8" x="279.1974" y="566.8782">UCBD 008 - discover the different operations that factory supports</text></g><g id="elem_UC9"><ellipse cx="362.5032" cy="630.9406" fill="#F1F1F1" rx="158.9032" ry="32.7406" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="308.4" x="208.3032" y="632.4594">UCBD 009 -  get the sequence of operations as well as obtaining the respective type of job, from a BOO of a given product</text></g><g id="elem_UC18"><ellipse cx="362.5802" cy="1108.596" fill="#F1F1F1" rx="54.1802" ry="11.796" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="94.4" x="315.3802" y="1110.1148">UCLP 001 - Create the domain model</text></g><g id="elem_UC19"><ellipse cx="362.6191" cy="1164.1638" fill="#F1F1F1" rx="144.0191" ry="29.7638" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="278.4" x="223.4191" y="1165.6826">UCLP 002 - present the functionality of simulation tools and results through a user-friendly text-based interface</text></g><g id="elem_UC20"><ellipse cx="362.6305" cy="1228.5261" fill="#F1F1F1" rx="96.8305" ry="20.3261" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="182.8" x="271.2305" y="1230.0448">UCLP 003 - visualize the Product Struture (graphically) for a given article</text></g><g id="elem_UC10"><ellipse cx="362.6221" cy="28.1244" fill="#F1F1F1" rx="123.8221" ry="25.7244" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="237.6" x="243.8221" y="29.6432">UCEI 001 - Define the adequate data structures to store the information imported from the files</text></g><g id="elem_UC11"><ellipse cx="362.5543" cy="85.7109" fill="#F1F1F1" rx="82.7543" ry="17.5109" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="154" x="285.5543" y="87.2296">UCEI 002 - Implement a simulator that processes all the article</text></g><g id="elem_UC12"><ellipse cx="362.6422" cy="134.2884" fill="#F1F1F1" rx="79.6422" ry="16.8884" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="147.6" x="288.8422" y="135.8072">UCEI 003 - Calculate the total production time for the article</text></g><g id="elem_UC13"><ellipse cx="362.5563" cy="181.3513" fill="#F1F1F1" rx="75.9563" ry="16.1513" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="140" x="292.5563" y="182.87">UCEI 004 - Calculate execution times by each operationTest</text></g><g id="elem_UC14"><ellipse cx="362.6124" cy="269.4825" fill="#F1F1F1" rx="284.6124" ry="57.8825" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="560.8" x="82.2124" y="271.0012">UCEI 005 - Present a list of machines with total time of operationTest, and percentages relative to the operationTest time and total execution time, sorted in ascending order of the percentage of execution time relative to the total time</text></g><g id="elem_UC15"><ellipse cx="362.6129" cy="367.0826" fill="#F1F1F1" rx="124.6129" ry="25.8826" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="239.2" x="243.0129" y="368.6013">UCEI 006 - Present average execution times per operationTest and the corresponding waiting times</text></g><g id="elem_UC16"><ellipse cx="362.6292" cy="429.4458" fill="#F1F1F1" rx="108.4292" ry="22.6458" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="206.4" x="259.4292" y="430.9646">UCEI 007 - Produce a listing representing the flow dependency between machines</text></g><g id="elem_UC17"><ellipse cx="362.684" cy="499.4968" fill="#F1F1F1" rx="161.684" ry="33.2968" style="stroke:#181818;stroke-width:0.20000000000000004;"/><text fill="#000000" font-family="sans-serif" font-size="5.6" lengthAdjust="spacing" textLength="314" x="205.684" y="501.0155">UCEI 008 - Consider an improvement to the simulator developed that takes into account a processing order based on priority</text></g><!--link PO to UC1--><g id="link_PO_UC1"><path d="M29.752,918.66 C33.444,872.472 46.62,740.136 78,713 C110.164,685.188 224.846,685.0665 298.322,688.0545 " fill="none" id="PO-to-UC1" style="stroke:#181818;stroke-width:0.4000000000000001;"/><polygon fill="#181818" points="300.72,688.152,297.188,686.407,298.7217,688.0707,297.058,689.6044,300.72,688.152" style="stroke:#181818;stroke-width:0.4000000000000001;"/></g><!--link PO to UC2--><g id="link_PO_UC2"><path d="M30.724,918.708 C36.336,879.328 52.868,778.896 78,758.2 C144.152,703.724 248.4474,712.0711 310.56